<h2>Lista de tareas</h2>

<form (ngSubmit)="agregarTarea()">
  <input [(ngModel)]="tareaNueva" name="tareaNueva" placeholder="Nueva tarea" />
  <button type="submit">Agregar</button>
</form>

<p>Total: {{ tareas.length }} tareas</p>

<ul>
  @for (tarea of tareas; track tarea) {
    <li [class.hecha]="tarea.hecha">
      <span (click)="toggleHecha(tarea)">{{ tarea.texto }}</span>
      <button (click)="borrarTarea(tarea)">X</button>
    </li>
  }
</ul>
