<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D.O.M - Lista de Tareas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Tareas asignadas</h1>

  <!-- Aqui JavaScript va a escribir el numero de tareas -->
  <p id="contador">Total: 0 tareas</p>

  <!-- El formulario: aqui el usuario escribe la tarea y a quien se le asigna -->
  <form id="formulario">
    <input id="tarea" type="text" placeholder="Que hay que hacer?">
    <input id="persona" type="text" placeholder="Para quien?">
    <button type="submit">Agregar</button>
  </form>

  <!-- La lista empieza VACIA. JavaScript va a meter los <li> aqui dentro -->
  <ul id="lista"></ul>

  <script src="app.js"></script>
</body>
</html>
